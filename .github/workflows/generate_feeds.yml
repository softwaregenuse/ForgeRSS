name: Generate Xueqiu Feeds

on:
  schedule:
    # 每 8 小时运行一次
    - cron: '0 */8 * * *'

  workflow_dispatch:
    inputs:
      max_posts:
        description: 'Max posts per user'
        required: false
        default: '20'
        type: string

permissions:
  contents: write

env:
  XUEQIU_USERS: ${{ vars.XUEQIU_USER_ID }}
  XUEQIU_MAX_POSTS: ${{ github.event.inputs.max_posts || '20' }}

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg

          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list

          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          google-chrome --version

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Remove old shared Xueqiu cache
        run: |
          rm -f cache/xueqiu_user.json
          rm -f feeds/feed_xueqiu_user.xml

          echo "Old shared Xueqiu cache removed"

      - name: Generate isolated Xueqiu feeds
        run: |
          if [ -z "$XUEQIU_USERS" ]; then
            echo "XUEQIU_USER_ID is not configured"
            exit 1
          fi

          IFS=',' read -ra USERS <<< "$XUEQIU_USERS"

          for UID_VALUE in "${USERS[@]}"; do
            UID_VALUE="$(echo "$UID_VALUE" | xargs)"

            if [ -z "$UID_VALUE" ]; then
              continue
            fi

            if ! [[ "$UID_VALUE" =~ ^[0-9]+$ ]]; then
              echo "Invalid Xueqiu UID: $UID_VALUE"
              exit 1
            fi

            echo "========================================"
            echo "Generating isolated Xueqiu RSS"
            echo "UID: $UID_VALUE"
            echo "========================================"

            export XUEQIU_USER_ID="$UID_VALUE"

            INTERNAL_FEED="feeds/feed_xueqiu_${UID_VALUE}.xml"
            PUBLIC_FEED="feeds/xueqiu_${UID_VALUE}.xml"
            CACHE_FILE="cache/xueqiu_${UID_VALUE}.json"

            # 防止上一次遗留的临时输出被误认为本次成功生成
            rm -f "$INTERNAL_FEED"

            python scripts/run_single.py xueqiu_user \
              --max "$XUEQIU_MAX_POSTS"

            if [ ! -f "$INTERNAL_FEED" ]; then
              echo "ERROR: Feed was not generated:"
              echo "$INTERNAL_FEED"
              exit 1
            fi

            if [ ! -f "$CACHE_FILE" ]; then
              echo "ERROR: Independent cache was not generated:"
              echo "$CACHE_FILE"
              exit 1
            fi

            # 保持你原来的公开 RSS 地址不变
            mv "$INTERNAL_FEED" "$PUBLIC_FEED"

            echo "Generated RSS:"
            echo "$PUBLIC_FEED"

            echo "Independent cache:"
            echo "$CACHE_FILE"
          done

      - name: Validate feeds
        run: |
          python scripts/validate_feeds.py

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add -A feeds/
          git add -A cache/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update isolated Xueqiu RSS feeds [skip ci]"
            git push
          fi
