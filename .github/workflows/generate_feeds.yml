name: Generate Xueqiu Feeds

on:
  schedule:
    # 每 4 小时运行一次
    - cron: '0 */4 * * *'

  workflow_dispatch:
    inputs:
      max_posts:
        description: 'Max posts per user'
        required: false
        default: '20'
        type: string

permissions:
  contents: write

env:
  XUEQIU_USERS: ${{ vars.XUEQIU_USER_ID }}
  XUEQIU_MAX_POSTS: ${{ github.event.inputs.max_posts || '20' }}

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg

          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list

          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Generate separate Xueqiu feeds
        run: |
          # 启动 Chrome，并保持在同一个 step 中运行
          mkdir -p /tmp/chrome-xueqiu

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/chrome-xueqiu \
            about:blank \
            >/tmp/chrome.log 2>&1 &

          CHROME_PID=$!

          echo "Waiting for Chrome DevTools..."

          for i in {1..15}; do
            if curl -s http://127.0.0.1:9222/json/version >/tmp/devtools.json; then
              echo "Chrome DevTools is ready"
              cat /tmp/devtools.json
              break
            fi

            sleep 1
          done

          if ! curl -s http://127.0.0.1:9222/json/version >/dev/null; then
            echo "Chrome failed to start"
            cat /tmp/chrome.log
            exit 1
          fi

          if [ -z "$XUEQIU_USERS" ]; then
            echo "XUEQIU_USER_ID is not configured"
            exit 1
          fi

          IFS=',' read -ra USERS <<< "$XUEQIU_USERS"

          for UID_VALUE in "${USERS[@]}"; do
            UID_VALUE="$(echo "$UID_VALUE" | xargs)"

            if [ -z "$UID_VALUE" ]; then
              continue
            fi

            echo "========================================"
            echo "Generating Xueqiu RSS for UID: $UID_VALUE"
            echo "========================================"

            export XUEQIU_USER_ID="$UID_VALUE"

            python scripts/run_single.py xueqiu_user \
              --max "$XUEQIU_MAX_POSTS"

            if [ ! -f "feeds/feed_xueqiu_user.xml" ]; then
              echo "Feed file was not generated for $UID_VALUE"
              exit 1
            fi

            mv "feeds/feed_xueqiu_user.xml" \
               "feeds/xueqiu_${UID_VALUE}.xml"
          done

          kill "$CHROME_PID" 2>/dev/null || true

      - name: Validate feeds
        run: python scripts/validate_feeds.py

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add feeds/ cache/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Xueqiu RSS feeds [skip ci]"
            git push
          fi
