name: Generate Xueqiu Feed

on:
  schedule:
    # 每 4 小时运行一次
    - cron: '0 */4 * * *'

  workflow_dispatch:
    inputs:
      max_posts:
        description: 'Max posts in feed'
        required: false
        default: '20'
        type: string

permissions:
  contents: write

env:
  XUEQIU_USER_ID: ${{ vars.XUEQIU_USER_ID }}
  XUEQIU_MAX_POSTS: ${{ github.event.inputs.max_posts || '20' }}

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg

          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list

          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Xueqiu RSS
        run: |
          if [ -z "$XUEQIU_USER_ID" ]; then
            echo "XUEQIU_USER_ID is not configured"
            exit 1
          fi

          echo "Generating Xueqiu RSS for: $XUEQIU_USER_ID"

          python scripts/run_single.py xueqiu_user \
            --max "$XUEQIU_MAX_POSTS"

      - name: Validate feeds
        run: python scripts/validate_feeds.py

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add feeds/feed_xueqiu_user.xml cache/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Xueqiu RSS [skip ci]"
            git push
          fi
