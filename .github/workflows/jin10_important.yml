name: Generate Jin10 Important RSS

on:
  schedule:
    # 每 30 分钟运行一次
    - cron: '*/30 * * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Jin10 important RSS
        run: |
          python scripts/generate_jin10_important.py

      - name: Validate generated RSS
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          path = "feeds/jin10_important.xml"

          tree = ET.parse(path)
          root = tree.getroot()

          items = root.findall("./channel/item")

          print("RSS XML OK")
          print("items =", len(items))

          if len(items) == 0:
              raise SystemExit("No RSS items generated")
          PY

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add feeds/jin10_important.xml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Jin10 important RSS [skip ci]"
            git push
          fi
