name: Generate Jin10 Hot RSS

on:
  schedule:
    - cron: '*/30 * * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg

          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list

          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          google-chrome --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4

      - name: Generate Jin10 hot RSS
        run: |
          python scripts/generate_jin10_hot.py

      - name: Validate generated RSS
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          path = "feeds/jin10_hot.xml"

          tree = ET.parse(path)
          root = tree.getroot()

          items = root.findall("./channel/item")

          print("RSS XML OK")
          print("items =", len(items))

          if len(items) == 0:
              raise SystemExit("No RSS items generated")
          PY

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add feeds/jin10_hot.xml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Jin10 hot RSS [skip ci]"
            git push
          fi
